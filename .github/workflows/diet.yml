name: Copy File to Gist Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  copy-to-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read File and Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_FILE_NAME: 'diet.txt'
          SOURCE_FILE_PATH: 'diet.txt'
        run: |
          if [ ! -f "$SOURCE_FILE_PATH" ]; then
            echo "Error: $SOURCE_FILE_PATH が見つかりません。"
            exit 1
          fi

          # 1. データを安全にJSON化
          JSON_DATA=$(jq -n \
            --arg filename "$GIST_FILE_NAME" \
            --arg content "$(cat "$SOURCE_FILE_PATH")" \
            '{files: {($filename): {content: $content}}}')

          # 2. URLに直接IDを書き込み、改行をなくして1行で確実に送信（Classicトークン用に Authorization も再修正）
          curl -L -X PATCH -H "Accept: application/vnd.github+json" -H "Authorization: token $GIST_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://github.com" -d "$JSON_DATA"
